    <style>
      :root {
        color-scheme: light;
        /* --- カラートークン（元の水色＋赤/黄色の配色に戻した） --- */
        --bg: #eaf6ff;           /* ベース背景（水色系） */
        --surface: #f7fbff;      /* カード・入力欄の面 */
        --surface-border: #90caf9; /* ヘアラインの境界線 */
        --ink: #1a3d5c;          /* 主要テキスト */
        --ink-dim: #5b7893;      /* ラベル・補助テキスト */
        --work: #4285f4;         /* 作業フェーズのアクセント（青） */
        --rest: #fbbc05;         /* 休憩フェーズのアクセント（黄） */
        --danger: #ea4335;       /* 停止・リセット（赤） */

        /* work/dangerの濃い背景には白文字、restの明るい黄色背景には
           濃色文字、とコントラストを固定（--ink/--bgはテーマで変わる
           ためアクセント色の上の文字には使わない） */
        --text-on-dark-accent: #ffffff;  /* 青/赤背景の上の文字 */
        --text-on-light-accent: #2b2b2b; /* 黄色背景の上の文字 */
        --control-overlay: rgba(255, 255, 255, 0.75);        /* 全画面ボタンの地色 */
        --control-overlay-active: rgba(255, 255, 255, 0.95);

        /* --- タイポグラフィトークン --- */
        --font-sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'Chivo Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
      }

      * { box-sizing: border-box; }
      body {
        font-family: var(--font-sans);
        background: linear-gradient(135deg, #bfe0ff 0%, #e6f4ff 100%);
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      #card {
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 16px;
        padding: 24px;
        width: 100%;
        max-width: 320px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      h1 {
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--ink-dim);
        margin: 0 0 16px;
      }

      /* --- 設定エリア --- */
      #settings {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
      }
      .settingBox {
        flex: 1;
        text-align: left;
      }
      .settingBox label {
        display: block;
        font-size: 11px;
        color: var(--ink-dim);
        margin-bottom: 4px;
      }
      .settingBox input {
        width: 100%;
        padding: 10px 6px;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 24px;
        font-weight: 600;
        color: var(--ink);
        border: 1px solid var(--surface-border);
        border-radius: 8px;
        text-align: center;
        background: var(--bg);
      }
      .settingBox input:disabled {
        background-color: var(--surface);
        color: var(--ink-dim);
        border-color: var(--surface-border);
      }

      /* --- 音量調節 --- */
      #volumeRow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        text-align: left;
      }
      #volumeRow label {
        font-size: 13px;
        color: var(--ink-dim);
        white-space: nowrap;
      }
      #volumeSlider {
        flex: 1;
        accent-color: var(--work);
      }
      #volumeValue {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: var(--ink-dim);
        width: 32px;
        text-align: right;
      }

      /* --- 通知設定 --- */
      #notifyRow {
        margin-bottom: 16px;
        text-align: left;
        font-size: 13px;
        color: var(--ink-dim);
      }
      #notifyRow label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      #notifyRow input[type="checkbox"] {
        accent-color: var(--work);
      }
      #notifyMsg {
        display: block;
        font-size: 11px;
        color: var(--danger);
        margin-top: 4px;
        min-height: 1.4em;
      }

      /* タイマーの数字部分 */
      #display {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: clamp(44px, 13vw, 68px);
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 12px 0 20px;
        color: var(--ink);
        border: 1px solid var(--surface-border);
        border-radius: 10px;
        padding: 20px;
        background: var(--bg);
        transition: border-color 0.3s ease;
      }

      /* フェーズに応じて数字表示の縁取りとサイクルバッジの色が切り替わる
         （作業＝amber／休憩＝teal。文字を読まなくても一目で今の状態がわかる） */
      #displayWrap.phase-work #display { border-color: var(--work); }
      #displayWrap.phase-rest #display { border-color: var(--rest); }
      #displayWrap.phase-work #cycleCount { background-color: var(--work); color: var(--text-on-dark-accent); }
      #displayWrap.phase-rest #cycleCount { background-color: var(--rest); color: var(--text-on-light-accent); }

      /* 数字表示＋全画面ボタンをまとめる枠 */
      #displayWrap { position: relative; }
      #numberBox { position: relative; }
      /* 全画面中はボタンの基準を画面全体(#displayWrap)に切り替える */
      #displayWrap.fsActive #numberBox {
        position: static;
      }

      /* 全画面切り替えボタン（数字の右上に重ねて表示） */
      #fullscreenBtn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 30px;
        height: 30px;
        padding: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--control-overlay);
        color: var(--ink-dim);
        border: 1px solid var(--surface-border);
        border-radius: 8px;
      }
      /* アイコンの出し分けはJS側でstyle.displayを直接制御する（SVGのhidden属性は環境により反映が不安定なため使わない） */
      #fullscreenBtn:active { background: var(--control-overlay-active); }

      /* --- 全画面表示中のスタイル（YouTube風にカウントダウン部分だけを画面いっぱいに） ---
         ブラウザ標準のFullscreen APIはiPhone(WebKit)では動作しないことがあるため、
         実際の全画面遷移が成功したかどうかに関わらず、position:fixedで画面全体を
         覆う「疑似全画面」をCSSだけで実現し、.fsActiveクラスで一括制御する。 */
      #displayWrap.fsActive {
        position: fixed;
        /* 100vw/100vhではなくtop/right/bottom/leftの0指定で埋める。
           スマホ縦画面はアドレスバー分だけ100vhが実際の表示領域よりも
           大きくなり、下部のボタンが画面外にはみ出す不具合があったため。 */
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        max-width: none;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 全画面は明るいテーマを選んでいても常にダーク固定（暗い部屋での
           視聴を想定した「集中モード」のため、カードのテーマとは独立させる） */
        background: #0d1b2a;
        margin: 0;
        z-index: 999999;
      }
      #displayWrap.fsActive #display {
        font-size: 20vw;
        border: none;
        background: transparent;
        color: #eaf4ff;
        margin: 0;
        padding: 0;
      }
      #displayWrap.fsActive #fullscreenBtn {
        top: 24px;
        right: 24px;
        background: rgba(255, 255, 255, 0.15);
        color: #eaf4ff;
        border-color: rgba(255, 255, 255, 0.4);
      }

      /* 全画面中：サイクル数バッジを画面上部に固定（ノッチ等のセーフエリア分も余白を確保） */
      #displayWrap.fsActive #cycleCount {
        position: absolute;
        top: calc(32px + env(safe-area-inset-top, 0px));
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
      }

      /* 全画面中：ステータス表示＋操作ボタンを画面下部に固定（普段は隠す） */
      #fsFooter { display: contents; }
      #displayWrap.fsActive #fsFooter {
        display: block;
        position: absolute;
        bottom: calc(32px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 320px;
        padding: 0 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      /* カーソルを下部に移動 / スマホでタップした時だけ表示 */
      #displayWrap.fsActive.showFooter #fsFooter {
        opacity: 1;
        pointer-events: auto;
      }
      #displayWrap.fsActive #status {
        color: #ff8a80; /* 常にダークな全画面背景での視認性を優先した固定色 */
      }

      /* ボタン全般のスタイル（アイコンはテキストの左側に配置） */
      button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        font-family: var(--font-sans);
        font-size: 15px;
        cursor: pointer;
        width: 100%;
        border-radius: 8px;
        border: none;
        color: var(--ink);
        font-weight: 600;
        margin-bottom: 5px;
      }
      button .icon { flex-shrink: 0; display: block; }

      /* 開始・再開系（青） */
      .btn-blue { background-color: var(--work); color: var(--text-on-dark-accent); }
      .btn-blue:active { background-color: #357ae8; }

      /* 停止・リセット系（赤） */
      .btn-red { background-color: var(--danger); color: var(--text-on-dark-accent); }
      .btn-red:active { background-color: #c5221f; }

      /* 一時停止系（黄） */
      .btn-yellow { background-color: var(--rest); color: var(--text-on-light-accent); }
      .btn-yellow:active { background-color: #e0a800; }

      /* 一時停止ボタン専用（最初は非表示） */
      #pauseBtn { display: none; }

      /* 音テストボタン（枠線だけの控えめなゴーストボタン） */
      #testBtn {
        background-color: transparent;
        border: 1px solid var(--surface-border);
        color: var(--ink-dim);
        font-size: 11px;
        padding: 5px;
      }

      /* 状態表示テキスト（計測中・インターバルなど） */
      #status { color: var(--ink-dim); margin-top: 15px; font-size: 13px; min-height: 1.5em; font-weight: 600; }

      /* サイクル数表示 */
      #cycleCount {
        display: inline-block;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        background-color: var(--surface-border);
        border-radius: 8px;
        padding: 6px 14px;
        margin-bottom: 10px;
        transition: background-color 0.3s ease;
      }

      /* 計測中は設定項目をたたんで数字に意識が向くようにする
         （display:noneだと変化が唐突なので、高さと透明度を滑らかに閉じる） */
      #settings, #volumeRow, #notifyRow, #testBtn {
        max-height: 100px;
        opacity: 1;
        overflow: hidden;
        transition: max-height 0.3s ease, opacity 0.2s ease, margin 0.3s ease;
      }
      #card.is-running #settings,
      #card.is-running #volumeRow,
      #card.is-running #notifyRow,
      #card.is-running #testBtn {
        max-height: 0;
        opacity: 0;
        margin: 0;
        pointer-events: none;
      }

      #about {
        max-width: 320px;
        margin: 16px auto 0;
        padding: 0 8px;
        text-align: center;
      }
      #about h2 {
        font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-dim);
        margin: 0 0 6px;
      }
      #about p {
        font-family: var(--font-sans);
        font-size: 11px;
        line-height: 1.6;
        color: var(--ink-dim);
        margin: 0;
      }
    </style>

  <body>
    <div id="card">
      <h1>カウントダウンタイマー</h1>

      <div id="settings">
        <div class="settingBox">
          <label for="workMin">作業(分)</label>
          <input type="number" id="workMin" min="0.1" step="0.1" value="25">
        </div>
        <div class="settingBox">
          <label for="breakMin">休憩(分)</label>
          <input type="number" id="breakMin" min="0.1" step="0.1" value="5">
        </div>
      </div>

      <div id="volumeRow">
        <label for="volumeSlider">🔊 音量</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="50" oninput="onVolumeChange()">
        <span id="volumeValue">50%</span>
      </div>

      <div id="notifyRow">
        <label>
          <input type="checkbox" id="notifyToggle" onchange="onNotifyToggle()">
          🔔 他のタブ表示中も通知でお知らせ
        </label>
        <span id="notifyMsg"></span>
      </div>

      <div id="displayWrap">
        <div id="cycleCount">準備完了</div>
        <div id="numberBox">
          <div id="display">00:00</div>
          <button id="fullscreenBtn" type="button" onclick="toggleFullscreen()" title="全画面表示">
            <svg id="fsIconExpand" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
            <svg id="fsIconCompress" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
          </button>
        </div>
        <div id="fsFooter">
          <div id="status"></div>
          <button id="mainBtn" class="btn-blue" onclick="toggleTimer(event)">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span class="btnLabel">スタート</span>
          </button>
          <button id="pauseBtn" class="btn-yellow" onclick="togglePause(event)">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            <span class="btnLabel">一時停止</span>
          </button>
        </div>
      </div>
      <button id="testBtn" onclick="playBeep(2)">
        <svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        <span class="btnLabel">音テスト</span>
      </button>
    </div>

    <section id="about">
      <h2>無料のポモドーロ・カウントダウンタイマー</h2>
      <p>
        作業時間と休憩時間を設定するだけで、自動で繰り返してくれるシンプルなカウントダウンタイマーです。
        ポモドーロ・テクニックでの勉強や仕事の時間管理に使えます。インストール不要・ログイン不要で、
        ブラウザを開けばすぐに使えます。
      </p>
    </section>

<script>
  /* --- 状態を管理する変数（グローバル変数） --- */
  let timerId = null;      // カウントダウン（setInterval）を止めるためのID
  let isRunning = false;   // タイマーが動いているかどうかのフラグ
  let isPaused = false;    // 一時停止中かどうかのフラグ
  let audioCtx = null;     // Web Audio API（音を鳴らす仕組み）の管理
  let currentCycle = 1;    // 現在何セット目か
  const MAX_CYCLES = 100;   // 最大何セットまで繰り返すか
  let currentPhaseLabel = ''; // タブタイトルに出すフェーズ表示（作業中/休憩中）
  const originalTitle = document.title; // タイマー停止時に戻すための元のタイトル

  // mainBtn/pauseBtnのアイコン（状態に応じて差し替える。テキストと一緒にまとめて切り替える）
  const ICON_PLAY = '<svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const ICON_STOP = '<svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  const ICON_PAUSE = '<svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

  /**
   * ボタンのアイコンとラベルをまとめて差し替える
   */
  function setBtnContent(btn, iconHtml, label) {
    btn.innerHTML = iconHtml + '<span class="btnLabel">' + label + '</span>';
  }

  // 一時停止から再開するために現在の残り時間と処理を保存する変数
  let remainingSeconds = 0;
  let onCompleteCallback = null;

  const STORAGE_KEY_WORK = 'pomodoroWorkMin';
  const STORAGE_KEY_BREAK = 'pomodoroBreakMin';
  const STORAGE_KEY_VOLUME = 'pomodoroVolume';
  const STORAGE_KEY_NOTIFY = 'pomodoroNotifyEnabled';
  const MAX_GAIN = 0.3; // スライダー100%時の最大音量（元の固定値0.15はスライダー50%相当）

  // ページを開いた時に前回の設定値を復元（スプレッドシートB2/C2の代わり）
  window.addEventListener('DOMContentLoaded', () => {
    try {
      const savedWork = localStorage.getItem(STORAGE_KEY_WORK);
      const savedBreak = localStorage.getItem(STORAGE_KEY_BREAK);
      const savedVolume = localStorage.getItem(STORAGE_KEY_VOLUME);
      if (savedWork) document.getElementById('workMin').value = savedWork;
      if (savedBreak) document.getElementById('breakMin').value = savedBreak;
      if (savedVolume !== null) document.getElementById('volumeSlider').value = savedVolume;
    } catch (e) { /* localStorageが使えない環境でも動作は継続 */ }
    document.getElementById('volumeValue').innerText = document.getElementById('volumeSlider').value + '%';

    // 通知設定の復元（ブラウザ側で許可が取り消されている場合はOFFのまま表示）
    const notifyRow = document.getElementById('notifyRow');
    const notifyCheckbox = document.getElementById('notifyToggle');
    if (!('Notification' in window)) {
      notifyRow.style.display = 'none'; // 非対応環境では項目自体を隠す
    } else {
      let savedNotify = '0';
      try { savedNotify = localStorage.getItem(STORAGE_KEY_NOTIFY) || '0'; } catch (e) { /* 既定値のまま継続 */ }
      notifyCheckbox.checked = (savedNotify === '1' && Notification.permission === 'granted');
    }
  });

  /**
   * 音量スライダーが動かされた時の処理
   */
  function onVolumeChange() {
    const slider = document.getElementById('volumeSlider');
    document.getElementById('volumeValue').innerText = slider.value + '%';
    try {
      localStorage.setItem(STORAGE_KEY_VOLUME, slider.value);
    } catch (e) { /* 保存できなくても動作は継続 */ }
  }

  /**
   * 通知チェックボックスが操作された時の処理
   * （ONにする時だけブラウザの通知許可を求める。ブロックされていたら自動でOFFに戻す）
   */
  function onNotifyToggle() {
    const checkbox = document.getElementById('notifyToggle');
    const msgEl = document.getElementById('notifyMsg');
    msgEl.innerText = '';

    if (!checkbox.checked) {
      try { localStorage.setItem(STORAGE_KEY_NOTIFY, '0'); } catch (e) { /* 保存できなくても動作は継続 */ }
      return;
    }

    Notification.requestPermission().then((permission) => {
      if (permission === 'granted') {
        try { localStorage.setItem(STORAGE_KEY_NOTIFY, '1'); } catch (e) { /* 保存できなくても動作は継続 */ }
      } else {
        checkbox.checked = false;
        try { localStorage.setItem(STORAGE_KEY_NOTIFY, '0'); } catch (e) { /* 保存できなくても動作は継続 */ }
        msgEl.innerText = '通知がブロックされています。ブラウザの設定から許可してください。';
      }
    });
  }

  /**
   * フェーズ切り替え（作業→休憩／休憩→作業）を通知する。
   * 他のタブを見ている間（document.hidden）だけ出す。画面を見ている間は
   * 音とタブタイトルで十分気づけるため、通知を重ねて邪魔にしない。
   */
  function notifyPhaseChange(title, body) {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    if (!document.hidden) return;

    let notifyEnabled = '0';
    try { notifyEnabled = localStorage.getItem(STORAGE_KEY_NOTIFY) || '0'; } catch (e) { /* 既定値のまま継続 */ }
    if (notifyEnabled !== '1') return;

    try {
      new Notification(title, { body: body, tag: 'countdown-timer-phase' });
    } catch (e) { /* 通知生成に失敗しても動作は継続 */ }
  }

  /**
   * スライダーの値(0-100)を実際のgain値に変換
   */
  function getVolumeGain() {
    const slider = document.getElementById('volumeSlider');
    return (parseFloat(slider.value) / 100) * MAX_GAIN;
  }

  /**
   * GASのgetSettings()の代わり。ページ内の入力欄から直接値を取る。
   */
  function getSettings() {
    const workMin = parseFloat(document.getElementById('workMin').value);
    const breakMin = parseFloat(document.getElementById('breakMin').value);
    return { workMin, breakMin };
  }

  /**
   * 電子音（ピ・ピ・ピ）を鳴らす関数
   */
  function playBeep(durationSeconds) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.type = 'square';
    oscillator.frequency.value = 1760;

    const now = audioCtx.currentTime;
    gainNode.gain.setValueAtTime(0, now);

    const pipDuration = 0.07;
    const pipGap = 0.05;
    const volume = getVolumeGain();

    for (let i = 0; i < durationSeconds; i++) {
      const cycleStart = now + i;
      gainNode.gain.setValueAtTime(volume, cycleStart);
      gainNode.gain.setValueAtTime(0, cycleStart + pipDuration);

      const secondPip = cycleStart + pipDuration + pipGap;
      gainNode.gain.setValueAtTime(volume, secondPip);
      gainNode.gain.setValueAtTime(0, secondPip + pipDuration);

      const thirdPip = secondPip + pipDuration + pipGap;
      gainNode.gain.setValueAtTime(volume, thirdPip);
      gainNode.gain.setValueAtTime(0, thirdPip + pipDuration);
    }
    oscillator.start(now);
    oscillator.stop(now + durationSeconds);
  }

  /**
   * スタート/停止ボタンが押された時の振分け
   */
  function toggleTimer(event) {
    // 全画面中の「ボタン以外をタップしたら隠す」処理へこのタップが伝わらないようにする
    if (event) event.stopPropagation();
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    if (isRunning) {
      stopTimer(); // 動いていれば停止（リセット）
    } else {
      currentCycle = 1;
      startTimer(); // 止まっていれば開始
    }
  }

  /**
   * 一時停止/再開を切り替える関数
   */
  function togglePause(event) {
    // 全画面中の「ボタン以外をタップしたら隠す」処理へこのタップが伝わらないようにする
    if (event) event.stopPropagation();
    if (!isRunning) return; // 動いていない時は何もしない

    const pauseBtn = document.getElementById('pauseBtn');

    if (!isPaused) {
      // 一時停止する処理
      clearInterval(timerId); // カウントダウンを止める
      isPaused = true;
      setBtnContent(pauseBtn, ICON_PLAY, '再開');
      pauseBtn.classList.replace('btn-yellow', 'btn-blue');
      document.getElementById('status').innerText = '【一時停止中】';
    } else {
      // 再開する処理
      isPaused = false;
      setBtnContent(pauseBtn, ICON_PAUSE, '一時停止');
      pauseBtn.classList.replace('btn-blue', 'btn-yellow');
      // 保存しておいた残り時間と後続処理でカウントダウンを再開
      runSequence(remainingSeconds, onCompleteCallback);
    }
  }

  /**
   * タイマーの開始処理
   */
  function startTimer() {
    const statusEl = document.getElementById('status');
    const cycleEl = document.getElementById('cycleCount');
    const pauseBtn = document.getElementById('pauseBtn');
    const workInput = document.getElementById('workMin');
    const breakInput = document.getElementById('breakMin');

    const settings = getSettings();
    let workMin = settings.workMin;
    let breakMin = settings.breakMin;

    if (isNaN(workMin) || isNaN(breakMin) || workMin <= 0 || breakMin <= 0) {
      statusEl.innerText = '設定値（作業時間・休憩時間）が正しくありません';
      return;
    }

    // 次回開いた時のために設定値を保存
    try {
      localStorage.setItem(STORAGE_KEY_WORK, workMin);
      localStorage.setItem(STORAGE_KEY_BREAK, breakMin);
    } catch (e) { /* 保存できなくても動作は継続 */ }

    isRunning = true;
    isPaused = false;
    const mainBtn = document.getElementById('mainBtn');
    const wrap = document.getElementById('displayWrap');
    setBtnContent(mainBtn, ICON_STOP, '停止・リセット');
    mainBtn.classList.replace('btn-blue', 'btn-red');
    pauseBtn.style.display = 'flex'; // 一時停止ボタンを表示
    workInput.disabled = true;  // 計測中は設定変更不可に
    breakInput.disabled = true;
    document.getElementById('card').classList.add('is-running'); // 設定欄をたたんで数字に集中させる

    function loop() {
      if (!isRunning || currentCycle > MAX_CYCLES) {
        if (currentCycle > MAX_CYCLES) statusEl.innerText = '最大回数に達しました';
        return;
      }

      cycleEl.innerText = 'サイクル: ' + currentCycle + ' / ' + MAX_CYCLES;

      // --- ステップ1: 集中時間の計測 ---
      currentPhaseLabel = '🔴作業中';
      wrap.classList.add('phase-work');
      wrap.classList.remove('phase-rest');
      statusEl.innerText = '【計測中...】';
      runSequence(workMin * 60, () => {
        if (!isRunning) return;
        playBeep(3);
        notifyPhaseChange('休憩時間です', '作業おつかれさまでした。少し休憩しましょう。');

        // --- ステップ2: 休憩時間の計測 ---
        currentPhaseLabel = '🟢休憩中';
        wrap.classList.add('phase-rest');
        wrap.classList.remove('phase-work');
        statusEl.innerText = '【インターバル】';
        runSequence(breakMin * 60, () => {
          if (!isRunning) return;
          playBeep(3);
          notifyPhaseChange('作業再開の時間です', '休憩終了です。次のサイクルを始めましょう。');
          currentCycle++;
          loop();
        });
      });
    }
    loop();
  }

  /**
   * カウントダウン処理（一時停止のために引数を保存するように変更）
   */
  function runSequence(totalSec, onComplete) {
    remainingSeconds = totalSec;   // 現在の残り秒数を保存
    onCompleteCallback = onComplete; // 終了時の処理を保存

    updateDisplay(remainingSeconds);

    if (timerId) clearInterval(timerId);

    timerId = setInterval(() => {
      if (isPaused) return; // 一時停止中なら数字を減らさない

      remainingSeconds--;
      if (remainingSeconds < 0) {
        clearInterval(timerId);
        onComplete();
        return;
      }
      updateDisplay(remainingSeconds);
    }, 1000);
  }

  /**
   * カウントダウン部分の全画面表示を切り替える（同じボタンでON/OFF）
   *
   * ブラウザ標準のFullscreen API (requestFullscreen) は、PC/Android Chromeでは
   * 動作するが、iPhone(WebKit系ブラウザ)では未対応・失敗することがある。
   * そのため「.fsActiveクラスをつける＝全画面表示中」として扱い、
   * 可能ならFullscreen APIも併用（対応環境ではブラウザのアドレスバー等も隠せる）しつつ、
   * 失敗・非対応の場合はCSSのposition:fixedによる疑似全画面のみで見た目を実現する。
   */
  function toggleFullscreen() {
    const wrap = document.getElementById('displayWrap');
    const isActive = wrap.classList.contains('fsActive');
    if (!isActive) {
      enterFullscreen();
    } else {
      exitFullscreen();
    }
  }

  function supportsRealFullscreen() {
    const el = document.documentElement;
    const enabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    const canRequest = el.requestFullscreen || el.webkitRequestFullscreen;
    return !!(enabled && canRequest);
  }

  function enterFullscreen() {
    const wrap = document.getElementById('displayWrap');
    if (supportsRealFullscreen()) {
      try {
        const request = wrap.requestFullscreen
          ? wrap.requestFullscreen()
          : wrap.webkitRequestFullscreen();
        Promise.resolve(request)
          .then(() => setFullscreenState(true))
          .catch(() => enterPseudoFullscreen()); // 対応表明はあるが実際は失敗する環境向けフォールバック
        return;
      } catch (e) {
        // requestFullscreenが同期的に例外を投げる環境向けフォールバック
      }
    }
    enterPseudoFullscreen();
  }

  function enterPseudoFullscreen() {
    document.getElementById('displayWrap').classList.add('fsPseudo');
    document.body.style.overflow = 'hidden'; // 背景側のスクロールを止める
    setFullscreenState(true);
  }

  function exitFullscreen() {
    const wrap = document.getElementById('displayWrap');
    if (wrap.classList.contains('fsPseudo')) {
      wrap.classList.remove('fsPseudo');
      document.body.style.overflow = '';
      setFullscreenState(false);
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  }

  // ボタンの見た目・表示状態クラスをまとめて更新
  function setFullscreenState(isFullscreen) {
    const wrap = document.getElementById('displayWrap');
    wrap.classList.toggle('fsActive', isFullscreen);
    const btn = document.getElementById('fullscreenBtn');
    btn.title = isFullscreen ? '全画面解除' : '全画面表示';
    document.getElementById('fsIconExpand').style.display = isFullscreen ? 'none' : 'block';
    document.getElementById('fsIconCompress').style.display = isFullscreen ? 'block' : 'none';
    // 全画面の出入りをまたいで下部ボタンの表示状態が残らないようにリセット
    clearTimeout(fsFooterHideTimer);
    wrap.classList.remove('showFooter');
    if (isFullscreen) {
      syncFsViewportBox();
      // ページを開いて最初に全画面にした時だけ、ブラウザ内部でvisualViewportの
      // 値の確定が遅れることがある（回転を挟むと直る＝タイミングの問題）ため、
      // 一定時間、位置合わせを繰り返して確定した値を確実に拾う
      scheduleFsViewportResync();
    } else {
      // 次回また合わなくなるのを防ぐため、固定していたサイズ指定を解除
      wrap.style.width = '';
      wrap.style.height = '';
      wrap.style.top = '';
      wrap.style.left = '';
    }
  }

  /**
   * 全画面(疑似)の表示範囲を、実際に見えている領域(visualViewport)に合わせる。
   * position:fixed; top/right/bottom/left:0 だけだと、スマホでアドレスバーが
   * 出ている時（特に横→縦に回転した直後）に実際の表示領域より大きいサイズに
   * なり、下部のボタンがアドレスバーの裏に隠れてしまうことがあったための対策。
   */
  function syncFsViewportBox() {
    const wrap = document.getElementById('displayWrap');
    if (!wrap.classList.contains('fsActive')) return;
    const vv = window.visualViewport;
    if (vv) {
      wrap.style.width = vv.width + 'px';
      wrap.style.height = vv.height + 'px';
      wrap.style.left = vv.offsetLeft + 'px';
      wrap.style.top = vv.offsetTop + 'px';
    } else {
      wrap.style.width = window.innerWidth + 'px';
      wrap.style.height = window.innerHeight + 'px';
      wrap.style.left = '0px';
      wrap.style.top = '0px';
    }
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncFsViewportBox);
    window.visualViewport.addEventListener('scroll', syncFsViewportBox);
  }
  window.addEventListener('resize', syncFsViewportBox);
  // 回転直後はvisualViewportの値がまだ更新されていないことがあるため少し遅らせて再計算
  window.addEventListener('orientationchange', () => setTimeout(syncFsViewportBox, 150));

  // 全画面に入った直後の一定時間、位置合わせを繰り返す（ページを開いて最初の
  // 全画面表示だけvisualViewportの値の確定が遅れることがあるため、間隔を空けて
  // 何度か読み直し、確定した正しい値を確実に反映させる）
  function scheduleFsViewportResync() {
    const deadline = Date.now() + 2000;
    function tick() {
      syncFsViewportBox();
      const wrap = document.getElementById('displayWrap');
      if (Date.now() < deadline && wrap.classList.contains('fsActive')) {
        setTimeout(tick, 150);
      }
    }
    tick();
  }

  // ブラウザ標準のFullscreen APIが実際に有効/解除された時（Escキーで解除された場合を含む）に追従
  function onFullscreenChange() {
    const isNativeFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const wrap = document.getElementById('displayWrap');
    if (!isNativeFullscreen && !wrap.classList.contains('fsPseudo')) {
      setFullscreenState(false);
    }
  }
  document.addEventListener('fullscreenchange', onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);

  /* --- 全画面中：カーソルが画面下部にある間（PC）／タップするたびに表示・非表示を切替（スマホ）--- */
  let fsFooterHideTimer = null;
  const FS_BOTTOM_ZONE_RATIO = 0.82; // 画面高さの下側18%にカーソルがあれば表示対象
  let usingTouch = false; // タッチ操作を検知したら、以後はタップ判定のみを使う
                           // （タップ後にブラウザが発火させる疑似マウスイベントに、
                           //   PC向けのカーソル位置判定が反応してすぐ隠れてしまうのを防ぐ）

  function isFullscreenNow() {
    return document.getElementById('displayWrap').classList.contains('fsActive');
  }

  function showFsFooter() {
    document.getElementById('displayWrap').classList.add('showFooter');
  }

  function hideFsFooter() {
    document.getElementById('displayWrap').classList.remove('showFooter');
  }

  // マウス操作: カーソルが下部にある間だけ表示し、離れたら隠す
  document.addEventListener('mousemove', (e) => {
    if (usingTouch || !isFullscreenNow()) return;
    clearTimeout(fsFooterHideTimer);
    if (e.clientY >= window.innerHeight * FS_BOTTOM_ZONE_RATIO) {
      showFsFooter();
    } else {
      fsFooterHideTimer = setTimeout(hideFsFooter, 300); // 通過しただけの時のチラつき防止
    }
  });

  // タッチ操作の検知のみ行う（表示⇔非表示の切り替えはclickイベント側で行う）
  document.addEventListener('touchstart', () => {
    usingTouch = true;
  }, { passive: true });

  // タッチ端末: タップするたびに表示⇔非表示を切り替える（自動では隠さない）
  // - ボタン(mainBtn/pauseBtn)自身がタップされた場合は、ボタン側のonclickで
  //   event.stopPropagation()を呼んでいるため、このハンドラには届かない
  //   （＝ボタンの処理だけが実行され、表示が隠れることはない）。
  // - それ以外（フッター内のステータス文字も含む）がタップされた場合はここに届き、
  //   表示中なら隠す・非表示中なら表示する、という単純なトグルになる。
  document.addEventListener('click', (e) => {
    if (!usingTouch || !isFullscreenNow()) return;
    const wrap = document.getElementById('displayWrap');
    if (wrap.classList.contains('showFooter')) {
      hideFsFooter();
    } else {
      showFsFooter();
    }
  });

  /**
   * 画面の「00:00」表示を更新する
   */
  function updateDisplay(seconds) {
    let m = Math.floor(seconds / 60);
    let s = seconds % 60;
    const text = ("0" + m).slice(-2) + ":" + ("0" + s).slice(-2);
    document.getElementById('display').innerText = text;

    // タブを見ていなくても残り時間が分かるようにタイトルにも反映
    if (isRunning) {
      document.title = text + ' ' + currentPhaseLabel + ' - ' + originalTitle;
    }
  }

  /**
   * 全てをリセットして停止する
   */
  function stopTimer() {
    if (timerId) clearInterval(timerId);
    isRunning = false;
    isPaused = false;

    // ボタンの表示状態を戻す
    const mainBtn = document.getElementById('mainBtn');
    setBtnContent(mainBtn, ICON_PLAY, 'スタート');
    mainBtn.classList.replace('btn-red', 'btn-blue');
    const pauseBtn = document.getElementById('pauseBtn');
    pauseBtn.style.display = 'none';
    setBtnContent(pauseBtn, ICON_PAUSE, '一時停止');
    pauseBtn.classList.remove('btn-blue');
    pauseBtn.classList.add('btn-yellow');

    document.getElementById('workMin').disabled = false;
    document.getElementById('breakMin').disabled = false;
    document.getElementById('card').classList.remove('is-running'); // 設定欄を再表示

    document.getElementById('display').innerText = '00:00';
    document.getElementById('status').innerText = 'リセットしました';
    document.getElementById('cycleCount').innerText = '停止中';

    currentPhaseLabel = '';
    document.getElementById('displayWrap').classList.remove('phase-work', 'phase-rest');
    document.title = originalTitle;
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }
</script>
  </body>
</html>
